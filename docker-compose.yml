services:
  flurp:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FLURP_DATABASE_PATH: /app/data/flurp.db
    volumes:
      - flurp_data:/app/data
      - flurp_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health').status == 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flurp_data:
  flurp_uploads:
